name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mac-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mac-universal
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: WinRemoteOps-macOS
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml

      # Publish the DMGs and portable ZIPs to GitHub Releases as v<package version>,
      # with that version's CHANGELOG.md section as the release notes.
      - name: Publish GitHub release
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          node scripts/release-notes.js "$VERSION" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --target "$TARGET_SHA" --title "WinRemoteOps $TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/*.dmg dist/*.zip dist/latest-mac.yml --clobber

      # Keep older releases' notes in sync with CHANGELOG.md too.
      - name: Refresh notes on earlier releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for v in $(grep -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -c4-); do
            if gh release view "v$v" >/dev/null 2>&1; then
              node scripts/release-notes.js "$v" > n.md && gh release edit "v$v" --notes-file n.md || true
            fi
          done
